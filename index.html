/* ENGINE THINKING FLOW — interactive step-through in How It Works */
.etf-wrap{position:relative}

/* PIPELINE — animated horizontal flow visualization */
.etf-pipeline{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 8px 12px;margin-bottom:14px}
.etf-pipeline-rail{position:absolute;top:30px;left:28px;right:28px;height:2px;background:rgba(53,133,224,0.16);border-radius:99px;z-index:1}
.etf-pipeline-fill{height:100%;background:linear-gradient(90deg,var(--cobalt) 0%,var(--magenta) 100%);border-radius:99px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 10px rgba(213,88,120,0.5)}
.etf-node{position:relative;z-index:2;background:transparent;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
.etf-node-circle{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid rgba(53,133,224,0.3);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;position:relative;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:0 1px 3px rgba(26,58,110,0.08)}
.etf-node:hover .etf-node-circle{border-color:var(--cobalt);transform:translateY(-2px);box-shadow:0 4px 12px rgba(26,58,110,0.15)}
.etf-node.done .etf-node-circle{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.etf-node.active .etf-node-circle{background:var(--magenta);border-color:var(--magenta-deep);color:#fff;transform:scale(1.15);box-shadow:0 4px 16px rgba(213,88,120,0.5)}
.etf-node-pulse{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--magenta);opacity:0;animation:etf-pulse 1.8s ease-out infinite}
@keyframes etf-pulse{0%{transform:scale(0.95);opacity:0.85}100%{transform:scale(1.4);opacity:0}}
.etf-node-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;color:var(--ink-soft);line-height:1.1;text-align:center;max-width:80px;transition:color 0.2s}
.etf-node.active .etf-node-label{color:var(--magenta-deep)}
.etf-node.done .etf-node-label{color:var(--cobalt)}

.etf-card{background:#fff;border:1.5px solid var(--cobalt-light);border-radius:12px;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 0 var(--cobalt-light);animation:etf-card-in 0.4s cubic-bezier(0.2,0.7,0.3,1)}

.etf-incoming{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 14px;background:rgba(53,133,224,0.06);border:1px dashed rgba(53,133,224,0.35);border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;line-height:1.45;color:var(--cobalt-deep)}
.etf-incoming-arrow{font-family:'Lilita One',serif;font-size:16px;color:var(--cobalt);flex-shrink:0;line-height:1}

.etf-play{background:var(--magenta);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;font-weight:700;text-transform:uppercase;padding:8px 16px;border-radius:99px;cursor:pointer;border:0;transition:background 0.15s,transform 0.1s;display:inline-flex;align-items:center;gap:6px}
.etf-play:hover{background:var(--magenta-deep);transform:translateY(-1px)}

.etf-card-watch-chip{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;background:rgba(53,133,224,0.08);color:var(--cobalt-deep);padding:3px 9px;border-radius:99px;border:1px solid rgba(53,133,224,0.22);letter-spacing:0.005em}

.etf-card-head{display:flex;gap:12px;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--cobalt-light)}

.etf-card-step-meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-top:3px}

.etf-card-title{font-family:'Lilita One',serif;font-weight:400;font-size:23px;letter-spacing:0.005em;line-height:1.05;color:var(--cobalt-deep);margin:0 0 7px}

.etf-card-verdict-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:#3B6B2D;font-weight:700;text-transform:uppercase;margin-bottom:5px}

.etf-controls{display:flex;justify-content:space-between;align-items:center;gap:14px}
.etf-btn{background:var(--butter-light);color:var(--cobalt-deep);border:1.5px solid var(--cobalt-light);padding:10px 18px;border-radius:99px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.02em;cursor:pointer;transition:all 0.15s}

.start-hero-chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;color:#fff;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);padding:3px 9px;border-radius:99px}
.start-hero-chip-conv{background:#7AB05D;border-color:#6AA04D;color:#fff}
.start-hero-right{position:relative;z-index:2;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.start-hero-btn{background:var(--magenta);color:#fff;border:0;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.1em;font-weight:800;text-transform:uppercase;padding:13px 22px;border-radius:99px;cursor:pointer;box-shadow:0 5px 0 var(--magenta-deep);transition:transform 0.1s,box-shadow 0.15s;white-space:nowrap}
.start-hero-btn:hover{transform:translateY(-1px);box-shadow:0 7px 0 var(--magenta-deep)}
.start-hero-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:rgba(255,255,255,0.8);font-weight:600;text-transform:uppercase;text-align:right}
@media(max-width:820px){.start-hero{flex-direction:column;align-items:flex-start;gap:14px}.start-hero-right{align-items:flex-start}.start-hero-sub{text-align:left}}

/* GROWTH TEAM — agents mapped to the specialist roles they run for the brand */
.growth-team{background:var(--butter-light);border:1.5px solid var(--cobalt);border-radius:16px;padding:20px 24px;margin:0 0 26px;box-shadow:0 2px 0 var(--cobalt)}
.gt-head{margin-bottom:16px}
.gt-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.gt-title{font-family:'Lilita One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;line-height:1.1;color:var(--cobalt-deep);margin-bottom:7px}
.gt-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;font-style:italic;line-height:1.5;color:var(--ink-soft);max-width:660px;letter-spacing:-0.005em;margin:0}
.gt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gt-card{background:#fff;border:1px solid var(--cobalt-light);border-radius:11px;padding:14px 15px}
body.theme-dark .gt-card{background:#202B49}
.gt-card-icon{font-size:24px;line-height:1;margin-bottom:7px}
.gt-card-role{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;color:var(--cobalt-deep);line-height:1.2}
body.theme-dark .gt-card-role{color:#E8E6F0}
.gt-card-agent{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.08em;color:var(--magenta-deep);font-weight:700;text-transform:uppercase;margin-top:3px}
.gt-card-does{font-family:'Inter',sans-serif;font-size:12px;line-height:1.5;color:var(--ink-soft);font-weight:500;margin-top:7px}
/* GROWTH-TEAM HANDOFF FLOW — signal → voice → strategist → team, with a flowing 'baton' */
.gt-flow{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.gt-flow-eye{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:12px;text-align:center}
.gt-flow-rail{display:flex;align-items:flex-start;gap:6px;justify-content:center}
.gt-flow-stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border:1px solid var(--cobalt-light);border-radius:11px;padding:12px 10px}
body.theme-dark .gt-flow-stage{background:#202B49}
.gt-flow-stage-you{background:rgba(234,126,154,0.1);border-color:rgba(234,126,154,0.45)}
body.theme-dark .gt-flow-stage-you{background:rgba(234,126,154,0.16)}
.gt-flow-icons{font-size:18px;line-height:1.2;letter-spacing:0.05em}
.gt-flow-cap{font-family:'Inter',sans-serif;font-size:11px;line-height:1.35;color:var(--ink-soft);font-weight:600}
.gt-flow-link{flex:0 0 30px;align-self:center;height:4px;border-radius:99px;background:var(--cobalt-light);position:relative;overflow:hidden;margin-top:26px}
.gt-flow-link::after{content:"";position:absolute;top:0;left:-45%;width:45%;height:100%;background:linear-gradient(90deg,transparent,var(--magenta),transparent);animation:gtbaton 2.6s linear infinite}
.gt-flow-link:nth-of-type(4)::after{animation-delay:.5s}
.gt-flow-link:nth-of-type(6)::after{animation-delay:1s}
@keyframes gtbaton{0%{left:-45%}100%{left:115%}}
@media(max-width:760px){.gt-flow-rail{flex-direction:column;align-items:stretch}.gt-flow-link{width:4px;height:22px;align-self:center;margin:0}.gt-flow-link::after{left:0;top:-45%;width:100%;height:45%;background:linear-gradient(180deg,transparent,var(--magenta),transparent);animation:gtbatonv 2.6s linear infinite}}
@keyframes gtbatonv{0%{top:-45%}100%{top:115%}}
.gt-foot{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--cobalt-deep);font-weight:700;text-transform:uppercase;text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
body.theme-dark .gt-foot{color:#C9D6EC}
@media(max-width:820px){.gt-grid{grid-template-columns:1fr}}

.lede-v2{background:linear-gradient(135deg,var(--cobalt) 0%,var(--cobalt-deep) 100%);color:#fff;border-radius:18px;padding:24px 32px 28px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(26,58,110,0.18)}
.lede-v2::before{content:"";position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(234,126,154,0.32) 0%,transparent 70%);pointer-events:none}

.lede-v2-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;color:rgba(255,255,255,0.85);font-weight:700;text-transform:uppercase;margin-bottom:20px;text-align:center;position:relative;z-index:2}

.lede-v2-grid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:24px;align-items:stretch;position:relative;z-index:2}
.lede-v2-stat{background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:140px}

.lede-v2-num{font-family:'Lilita One',serif;font-weight:400;font-size:54px;letter-spacing:0.005em;line-height:1;color:#fff}
.lede-v2-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.16em;color:rgba(255,255,255,0.92);font-weight:700;text-transform:uppercase}
.lede-v2-detail{font-family:'Fraunces';font-size:13px;line-height:1.5;color:rgba(255,255,255,0.88);font-weight:500;display:flex;flex-wrap:wrap;gap:5px;align-items:baseline;letter-spacing:-0.005em}
.lede-v2-detail-strong{color:#fff;font-weight:700}
.lede-v2-detail-dot{color:rgba(255,255,255,0.5);font-weight:300}

/* The platform-mix center stat */
.lede-v2-mini-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;color:rgba(255,255,255,0.85);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.lede-v2-bar{display:flex;gap:3px;height:48px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.08);margin:4px 0}
.lede-v2-bar-seg{display:flex;align-items:center;justify-content:center;font-family:'Lilita One',serif;font-size:18px;color:#fff;letter-spacing:0.005em;border-radius:8px;min-width:50px;transition:flex 0.4s}
.lede-v2-bar-seg span{font-family:'Lilita One',serif;font-size:15px;letter-spacing:0.01em}
.lede-v2-bar-ig{background:linear-gradient(135deg,var(--magenta) 0%,var(--magenta-deep) 100%)}
.lede-v2-bar-tt{background:linear-gradient(135deg,#1a1a1a 0%,#333 100%)}
.lede-v2-bar-pin{background:linear-gradient(135deg,#E60023 0%,#B30019 100%)}
.lede-v2-bar-other{background:linear-gradient(135deg,#F4B73E 0%,#E89A2E 100%);color:var(--cobalt-deep)}

/* The ride-now pill */
.lede-v2-ride-pill{display:flex;align-items:baseline;gap:6px;background:linear-gradient(135deg,var(--magenta) 0%,var(--magenta-deep) 100%);padding:10px 18px;border-radius:99px;align-self:flex-start;box-shadow:0 4px 16px rgba(213,88,120,0.4)}
.lede-v2-ride-icon{font-size:24px;line-height:1}
.lede-v2-ride-num{font-family:'Lilita One',serif;font-weight:400;font-size:32px;color:#fff;letter-spacing:0.005em;line-height:1}

@media (max-width:900px){
  .lede-v2-grid{grid-template-columns:1fr}
  .lede-v2{padding:20px 22px 24px}
  .lede-v2-num{font-size:42px}
}

/* PHONE-FRAME SHOT LIST — Willa's-pattern swipeable carousel (REPLACES the old PhonePreview) */
.psl-wrap{margin-bottom:22px;padding:20px 22px;background:linear-gradient(135deg,var(--butter-light) 0%,#FFF7C9 100%);border:1.5px solid var(--cobalt-light);border-radius:14px}
.psl-header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px;flex-wrap:wrap}
.psl-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.psl-title{font-family:'Lilita One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;color:var(--cobalt-deep);line-height:1.1}
.psl-audio{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--cobalt-light);border-radius:10px;padding:10px 14px;max-width:380px;min-width:240px}
.psl-audio-icon{font-size:18px;color:var(--magenta-deep);line-height:1.2}
.psl-audio-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:3px}
.psl-audio-text{font-size:12px;color:var(--cobalt-deep);line-height:1.4;font-weight:500}

.psl-carousel{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -6px;padding-left:6px;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--cobalt-light) transparent}
.psl-carousel::-webkit-scrollbar{height:8px}
.psl-carousel::-webkit-scrollbar-thumb{background:var(--cobalt-light);border-radius:99px}

.psl-phone{flex-shrink:0;width:180px;border-radius:24px;padding:8px 0;display:flex;flex-direction:column;cursor:pointer;border:0;background:#1a1a1a;transition:all 0.18s;aspect-ratio:9/16;position:relative;overflow:hidden}
.psl-phone-dim{opacity:0.55}
.psl-phone-dim:hover{opacity:0.85}
.psl-phone-active{box-shadow:0 8px 24px rgba(15,23,42,0.18);border:3px solid var(--cobalt-deep);padding:5px 0}

/* Pillar themes */
.psl-theme-fuel.psl-phone-active{background:linear-gradient(160deg,#F4B73E 0%,#E89A2E 100%)}
.psl-theme-bowl.psl-phone-active{background:linear-gradient(160deg,#7FA86F 0%,#5B8B47 100%)}
.psl-theme-soil.psl-phone-active{background:linear-gradient(160deg,#9E652E 0%,#6F4720 100%)}
.psl-theme-crunch.psl-phone-active{background:linear-gradient(160deg,var(--magenta) 0%,var(--coral) 100%)}
.psl-phone-dim{background:#DCD6C8}

.psl-phone-notch{align-self:center;width:42px;height:4px;background:#334155;border-radius:99px;margin-top:6px}
.psl-phone-dim .psl-phone-notch{background:#B0AC9F}
.psl-phone-scene{text-align:center;padding:6px 10px 0;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.16em;font-weight:700;text-transform:uppercase;color:#FACC15}
.psl-phone-dim .psl-phone-scene{color:#94928A}
.psl-phone-active .psl-phone-scene{background:rgba(250,204,21,0.16);margin:6px 22px 0;padding:3px 10px;border-radius:99px;display:block}
.psl-phone-body{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;text-align:center}
.psl-phone-text{font-family:'Fraunces';font-size:13px;line-height:1.3;font-weight:500;letter-spacing:-0.005em;color:#F8FAFC;text-wrap:balance}
.psl-phone-dim .psl-phone-text{color:#475569}
.psl-phone-text-hook{font-family:'Lilita One',serif;font-size:15px;font-weight:400;letter-spacing:0.005em;line-height:1.15}
.psl-phone-text-endcard{font-style:italic;font-size:12px}
.psl-phone-bottom{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 10px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;font-weight:600}
.psl-phone-time{color:#FACC15}
.psl-phone-counter{color:rgba(248,250,252,0.65)}
.psl-phone-dim .psl-phone-time{color:#94928A}
.psl-phone-dim .psl-phone-counter{color:#94928A}

/* PAID MEDIA AMPLIFICATION — Willa's-pattern 3-tier card */
.amp-block{padding:14px 16px;background:linear-gradient(135deg,rgba(53,133,224,0.04) 0%,rgba(234,126,154,0.04) 100%);border:1.5px solid var(--cobalt-light);border-radius:12px}
.amp-organic-note{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:rgba(122,176,93,0.08);border:1.5px dashed rgba(122,176,93,0.4);border-left:4px solid #7AB05D;border-radius:10px;margin-bottom:14px}
.amp-organic-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#3F6A33;font-weight:800;text-transform:uppercase;flex-shrink:0;padding-top:1px}
.amp-organic-text{font-family:'Fraunces';font-size:12.5px;line-height:1.5;color:var(--cobalt-deep);font-weight:500;letter-spacing:-0.005em}
.amp-organic-text strong{color:#3F6A33;font-weight:700}
/* Brief detail accordion — collapsible Production / Amplify sections */
/* Modal accordions — cobalt-tinted to read as interactive expanders (distinct from cream caption cards) */
.modal-acc{background:linear-gradient(135deg,rgba(53,133,224,0.06) 0%,rgba(53,133,224,0.02) 100%);border:1.5px solid rgba(53,133,224,0.32);border-left:4px solid var(--magenta);border-radius:10px;margin-bottom:14px;overflow:hidden;transition:all 0.18s}
.modal-acc:hover{border-color:var(--cobalt);background:linear-gradient(135deg,rgba(53,133,224,0.1) 0%,rgba(53,133,224,0.04) 100%)}
.modal-acc[open]{box-shadow:0 4px 10px rgba(26,58,110,0.08);background:linear-gradient(135deg,rgba(53,133,224,0.08) 0%,rgba(234,126,154,0.04) 100%)}
.modal-acc summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:12px;outline:none}
.modal-acc summary::-webkit-details-marker{display:none}
.modal-acc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--magenta-deep);font-weight:700;text-transform:uppercase;flex-shrink:0}
.modal-acc-title{font-family:'Fraunces';font-size:13.5px;line-height:1.4;color:var(--cobalt-deep);font-weight:600;letter-spacing:-0.005em;flex:1;min-width:0}
.modal-acc-chev{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--magenta);color:#fff;border-radius:50%;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;transition:transform 0.22s,background 0.18s;flex-shrink:0;box-shadow:0 2px 6px rgba(213,88,120,0.32)}
.modal-acc:hover .modal-acc-chev{background:var(--magenta-deep);transform:scale(1.05)}
.modal-acc[open] .modal-acc-chev{transform:rotate(180deg)}
.modal-acc[open]:hover .modal-acc-chev{transform:rotate(180deg) scale(1.05)}
.modal-acc-body{padding:0 14px 14px;border-top:1px dashed rgba(53,133,224,0.28);background:rgba(255,255,255,0.45)}
.modal-acc-body .amp-block,.modal-acc-body .modal-section{margin-top:14px;margin-bottom:0}
.amp-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--cobalt-light)}
.amp-block-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--cobalt-deep);font-weight:800;text-transform:uppercase}
.amp-agent-stamp{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600}

.amp-thesis{padding:0 0 10px 12px;border-left:3px solid var(--magenta);margin-bottom:12px}
.amp-thesis-headline{font-family:'Fraunces';font-size:14.5px;line-height:1.35;color:var(--cobalt-deep);font-weight:600;margin-bottom:5px;letter-spacing:-0.005em}
.amp-thesis-why{font-size:11.5px;line-height:1.5;color:var(--ink-soft);font-style:italic}

.amp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--cobalt-light);border:1px solid var(--cobalt-light);border-radius:10px;overflow:hidden;margin-bottom:12px}
.amp-stat{background:#fff;padding:9px 12px}
.amp-stat-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:0.14em;color:var(--ink-soft);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.amp-stat-num{font-family:'Lilita One',serif;font-weight:400;font-size:16px;color:var(--cobalt-deep);line-height:1.05;letter-spacing:0.005em}
.amp-stat-text{font-family:'Fraunces';font-size:12px;line-height:1.3;font-weight:500;font-style:normal}
.amp-stat-guard{background:#FEF2F2}
.amp-stat-guard .amp-stat-label{color:#DC2626}
.amp-stat-guard .amp-stat-num{color:#991B1B;font-size:12px;font-family:'Fraunces'}

.amp-placements{display:flex;flex-direction:column;gap:7px}
.amp-placement{padding:10px 12px;background:#fff;border:1px solid var(--cobalt-light);border-radius:8px}
.amp-placement-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.amp-placement-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.amp-placement-platform{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;font-weight:800}
.amp-placement-format{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600}
.amp-placement-budget{font-family:'Lilita One',serif;font-size:14px;color:var(--cobalt-deep);margin-left:auto;letter-spacing:0.005em}
.amp-placement-reach{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);font-weight:600}
.amp-placement-audience{font-size:11px;line-height:1.45;color:var(--cobalt-deep);margin-bottom:4px}
.amp-placement-note{font-size:10.5px;line-height:1.45;color:var(--ink-soft);font-style:italic;padding-top:5px;border-top:1px dashed var(--cobalt-light);margin-top:2px}

/* FOOTAGE INSPO — matches modal-acc expander treatment but butter-tinted (different family) */
.footage-section{padding:0;margin-bottom:14px}
.footage-toggle{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;background:linear-gradient(135deg,rgba(244,183,62,0.1) 0%,rgba(244,183,62,0.03) 100%);border:1.5px solid rgba(244,183,62,0.45);border-left:4px solid #F4B73E;border-radius:10px;cursor:pointer;transition:all 0.18s}
.footage-toggle:hover{background:linear-gradient(135deg,rgba(244,183,62,0.18) 0%,rgba(244,183,62,0.06) 100%);border-color:#E89A2E}
.footage-toggle-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#8A5A1F;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;flex-shrink:0}
.footage-toggle-hint{font-family:'Fraunces';font-size:13.5px;line-height:1.4;color:var(--cobalt-deep);text-align:left;font-weight:600;letter-spacing:-0.005em}
.footage-toggle-chev{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:#F4B73E;color:#fff;border-radius:50%;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;transition:transform 0.22s,background 0.18s;flex-shrink:0;box-shadow:0 2px 6px rgba(244,183,62,0.4)}
.footage-toggle:hover .footage-toggle-chev{background:#E89A2E;transform:scale(1.05)}
.footage-toggle-chev.open{transform:rotate(180deg)}
.footage-toggle:hover .footage-toggle-chev.open{transform:rotate(180deg) scale(1.05)}

.footage-grid{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.footage-cat{padding:13px 15px;background:#fff;border:1px solid var(--cobalt-light);border-radius:8px}
.footage-cat-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.footage-cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.footage-cat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;font-weight:800}
.footage-cat-hint{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:9px;line-height:1.4}
.footage-cat-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.footage-cat-list li{font-size:12.5px;line-height:1.45;color:var(--cobalt-deep)}

/* BRIEF MODAL HEAD — streamlined */
.brief-chip-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
.brief-chip-row .brief-priority{font-size:9px;padding:4px 10px}
.brief-chip-row .brief-platform{font-size:10px;color:var(--cobalt-deep);font-weight:700;letter-spacing:0.08em}
.brief-chip-row .brief-flavor{font-size:10px;padding:3px 9px}
.brief-chip-row .card-dna-chip{font-size:9.5px;padding:3px 9px}
.brief-timing-chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.08em;color:var(--magenta-deep);background:rgba(234,126,154,0.14);padding:3px 9px;border-radius:99px;font-weight:700;text-transform:uppercase}

/* PRODUCTION NOTES — streamlined visual + muse + timing strip */
.prod-notes{display:flex;flex-direction:column;gap:11px}
.prod-note{padding:10px 14px;background:rgba(53,133,224,0.04);border-radius:8px;border-left:2px solid var(--cobalt-light)}
.prod-note-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.prod-note-text{font-size:13px;line-height:1.5;color:var(--cobalt-deep)}

.modal-cta-row{margin-top:18px;padding-top:18px;border-top:1px solid var(--cobalt-light);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.modal-cta-text{font-size:11.5px;color:var(--ink-soft)}

@media (max-width:760px){
  .amp-stats{grid-template-columns:1fr 1fr}
  .footage-grid{grid-template-columns:1fr}
  .psl-phone{width:160px}
}

/* PHONE PREVIEW — phone-frame mockup at top of brief detail modal */
.phone-preview-wrap{display:grid;grid-template-columns:1fr auto;gap:28px;padding:20px 24px;margin-bottom:20px;background:linear-gradient(135deg,var(--butter-light) 0%,#FFF7C9 100%);border:1.5px solid var(--cobalt-light);border-radius:14px;align-items:center}
.phone-preview-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.phone-preview-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase}
.phone-preview-title{font-family:'Lilita One',serif;font-weight:400;font-size:24px;letter-spacing:0.005em;color:var(--cobalt-deep);line-height:1.1;margin-bottom:2px}
.phone-preview-sub{font-size:12px;color:var(--ink-soft);line-height:1.5}
.phone-preview-audio{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--cobalt-light);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:12px;line-height:1.4;color:var(--cobalt-deep)}
.phone-audio-icon{font-size:14px;color:var(--magenta-deep)}
.phone-audio-text{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.04em}

.phone-frame{width:240px;height:480px;background:#1a1a1a;border-radius:36px;padding:8px;position:relative;flex-shrink:0;box-shadow:0 12px 36px rgba(26,58,110,0.25),inset 0 0 0 2px #333}
.phone-notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:80px;height:18px;background:#1a1a1a;border-radius:0 0 14px 14px;z-index:3}
.phone-screen{width:100%;height:100%;border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* Pillar themes for the phone screen background */
.phone-theme-fuel .phone-screen{background:linear-gradient(165deg,#F4B73E 0%,#E89A2E 100%)}
.phone-theme-bowl .phone-screen{background:linear-gradient(165deg,#7FA86F 0%,#5B8B47 100%)}
.phone-theme-soil .phone-screen{background:linear-gradient(165deg,#9E652E 0%,#6F4720 100%)}
.phone-theme-crunch .phone-screen{background:linear-gradient(165deg,var(--magenta) 0%,var(--coral) 100%)}

.phone-status{display:flex;justify-content:space-between;padding:30px 18px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.9);font-weight:600}
.phone-status-right{display:flex;gap:4px;align-items:center;font-size:9px}

.phone-keyframe{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px;position:relative}
.phone-keyframe-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:rgba(255,255,255,0.78);font-weight:700;text-transform:uppercase;position:absolute;top:8px;left:22px}
.phone-keyframe-text{font-family:'Lilita One',serif;font-weight:400;font-size:24px;line-height:1.1;letter-spacing:0.005em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,0.4);text-wrap:balance}
.phone-keyframe-hook{font-size:26px}
.phone-keyframe-endcard{font-family:'Fraunces';font-style:italic;font-size:20px;font-weight:600;letter-spacing:-0.01em}
.phone-keyframe-stinger{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:rgba(255,255,255,0.85);font-weight:700;margin-top:14px;text-transform:uppercase}

.phone-overlay-bottom{padding:8px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,0.6),transparent);position:relative;z-index:2}
.phone-handle{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:#fff;margin-bottom:3px}
.phone-caption-preview{font-family:'Inter',sans-serif;font-size:10.5px;color:rgba(255,255,255,0.92);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.phone-dots{position:absolute;top:54px;left:0;right:0;display:flex;justify-content:center;gap:5px;padding:0 18px}
.phone-dot{width:100%;max-width:60px;height:3px;background:rgba(255,255,255,0.35);border-radius:99px;cursor:pointer;border:0;padding:0;transition:background 0.2s}
.phone-dot:hover{background:rgba(255,255,255,0.6)}
.phone-dot.active{background:#fff}

@media (max-width:680px){
  .phone-preview-wrap{grid-template-columns:1fr;justify-items:center}
  .phone-preview-meta{order:2;width:100%}
}

/* VOICE COMPASS — live brand-fidelity scorer (lives inside Studio modal as a mode) */
.studio-mode-toggle{display:flex;gap:4px;background:rgba(255,255,255,0.14);padding:4px;border-radius:99px;margin-left:auto;margin-right:14px}
.studio-mode{background:transparent;color:rgba(255,255,255,0.78);border:0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:0.02em;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.studio-mode:hover{color:#fff}
.studio-mode.active{background:#fff;color:var(--cobalt-deep)}

.vc-view{padding:6px 4px 24px;display:flex;flex-direction:column;gap:18px}

.vc-input-wrap{display:flex;flex-direction:column;gap:12px}
.vc-input{font-family:'Inter',sans-serif;font-size:14.5px;line-height:1.55;padding:14px 16px;border:1.5px solid var(--cobalt-light);border-radius:12px;background:var(--butter-light);color:var(--cobalt-deep);resize:vertical;min-height:96px;outline:none;transition:border-color 0.15s}
.vc-input:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(53,133,224,0.15)}
.vc-input::placeholder{color:#8A99B5}
.vc-input-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.vc-examples{display:flex;flex-wrap:wrap;gap:6px}
.vc-example{background:rgba(53,133,224,0.1);color:var(--cobalt-deep);border:1px solid rgba(53,133,224,0.25);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:0.01em;cursor:pointer;transition:all 0.15s}
.vc-example:hover:not(:disabled){background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.vc-example:disabled{opacity:0.5;cursor:not-allowed}
.vc-score-btn{background:var(--magenta);color:#fff;border:0;padding:12px 22px;border-radius:99px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.vc-score-btn:hover:not(:disabled){background:var(--magenta-deep);transform:translateY(-1px)}
.vc-score-btn:disabled{opacity:0.45;cursor:not-allowed}

.vc-error{background:rgba(232,144,125,0.18);color:#9E3F31;padding:10px 14px;border-radius:8px;font-size:13px}

.vc-loading{display:flex;align-items:center;gap:14px;padding:20px 22px;background:var(--butter-light);border:1px dashed var(--cobalt-light);border-radius:12px}
.vc-loading-pulse{width:24px;height:24px;border:3px solid var(--cobalt-light);border-top-color:var(--cobalt);border-radius:50%;animation:vc-spin 1s linear infinite;flex-shrink:0}
@keyframes vc-spin{to{transform:rotate(360deg)}}
.vc-loading-text{font-size:13px;color:var(--ink-soft);line-height:1.5}

.vc-results{display:flex;flex-direction:column;gap:14px}

.vc-score-banner{padding:22px 26px;border-radius:14px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.vc-band-high{background:linear-gradient(135deg,#E7F0DD 0%,#C8E0B2 100%);color:#2D5421}
.vc-band-mid{background:linear-gradient(135deg,#FAEED1 0%,#F4D88F 100%);color:#704F0A}
.vc-band-low{background:linear-gradient(135deg,#F8DCD7 0%,#EA9F95 100%);color:#7A2A1F}
.vc-score-big{font-family:'Lilita One',serif;font-weight:400;font-size:64px;letter-spacing:0.005em;line-height:1;display:flex;align-items:baseline;gap:4px}
.vc-score-big span{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;opacity:0.7;letter-spacing:0.02em}
.vc-verdict{font-family:'Fraunces';font-size:16px;line-height:1.4;font-weight:500;letter-spacing:-0.005em;font-style:italic}

.vc-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.vc-card{background:#fff;border:1.5px solid var(--cobalt-light);border-radius:12px;padding:18px 20px}
.vc-card-anti{border-color:rgba(213,88,120,0.5);background:linear-gradient(135deg,#fff 0%,rgba(234,126,154,0.04) 100%)}
.vc-card-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:14px}

.vc-territories{display:flex;flex-direction:column;gap:8px}
.vc-terr-row{display:grid;grid-template-columns:165px 1fr 28px;gap:10px;align-items:center}
.vc-terr-name{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;color:var(--cobalt-deep);letter-spacing:0.02em}
.vc-terr-bar{background:rgba(53,133,224,0.1);height:8px;border-radius:99px;overflow:hidden;position:relative}
.vc-terr-fill{background:linear-gradient(90deg,var(--cobalt) 0%,var(--magenta) 100%);height:100%;border-radius:99px;transition:width 0.4s ease-out;min-width:2px}
.vc-terr-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--cobalt-deep);text-align:right}

.vc-platforms{display:flex;flex-direction:column;gap:8px}
.vc-platform{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;border:1px solid var(--cobalt-light)}
.vc-platform-name{font-family:'Lilita One',serif;font-size:14px;letter-spacing:0.005em;color:var(--cobalt-deep)}
.vc-platform-fit{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;text-align:center}
.vc-fit-good{color:#3B6B2D;background:#E7F0DD}
.vc-fit-good .vc-platform-fit,.vc-platform.vc-fit-good .vc-platform-fit{background:#E7F0DD;color:#3B6B2D}
.vc-fit-needs-adjust .vc-platform-fit{background:#FAEED1;color:#8B6F1F}
.vc-fit-wrong-register .vc-platform-fit{background:#F8DCD7;color:#9E3F31}

.vc-positives{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.vc-positives li{font-size:12.5px;color:var(--cobalt-deep);line-height:1.45;padding-left:0;font-weight:500}

.vc-flags{display:flex;flex-direction:column;gap:10px}
.vc-flag{padding:11px 14px;border-radius:8px;background:#fff;border-left:3px solid var(--magenta-deep)}
.vc-flag-high{border-left-color:#9E3F31;background:rgba(232,144,125,0.08)}
.vc-flag-medium{border-left-color:#D55878;background:rgba(234,126,154,0.06)}
.vc-flag-low{border-left-color:#F4B73E;background:rgba(244,183,62,0.06)}
.vc-flag-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.vc-flag-sev{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(213,88,120,0.18);color:#9E3F31}
.vc-flag-high .vc-flag-sev{background:#9E3F31;color:#fff}
.vc-flag-name{font-family:'Lilita One',serif;font-size:14px;color:var(--cobalt-deep)}
.vc-flag-evidence{font-family:'Fraunces';font-size:12.5px;font-style:italic;color:var(--ink-soft);line-height:1.45}

.vc-rewrites{display:flex;flex-direction:column;gap:12px}
.vc-rewrite{background:var(--butter-light);border:1px solid var(--cobalt-light);border-radius:10px;padding:14px 16px}
.vc-rewrite-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.14em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.vc-rewrite-text{font-family:'Fraunces';font-size:14.5px;line-height:1.5;color:var(--cobalt-deep);margin-bottom:8px;font-weight:500;letter-spacing:-0.005em}
.vc-rewrite-use{background:transparent;color:var(--magenta-deep);border:1px solid var(--magenta);padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:all 0.15s}
.vc-rewrite-use:hover{background:var(--magenta);color:#fff}

@media (max-width:780px){
  .vc-grid{grid-template-columns:1fr}
  .vc-terr-row{grid-template-columns:130px 1fr 26px}
  .studio-mode-toggle{order:3;margin:0;width:100%}
}

/* STUDIO — The Strategist chat UI */
.studio-modal{max-width:920px;width:100%;max-height:88vh;display:flex;flex-direction:column;background:var(--butter);border-radius:16px;overflow:hidden}
.studio-head{display:flex;gap:14px;align-items:center;padding:18px 24px;background:var(--cobalt);color:#fff;border-bottom:2px solid var(--cobalt-deep);flex-shrink:0}
.studio-head-left{display:flex;align-items:center;gap:14px}
.studio-head-icon{width:42px;height:42px;border-radius:50%;background:var(--magenta);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 2px 8px rgba(213,88,120,0.4)}
.studio-head-title{font-family:'Lilita One',serif;font-weight:400;font-size:22px;letter-spacing:0.005em;line-height:1;color:#fff}
.studio-head-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.06em;color:rgba(255,255,255,0.78);margin-top:5px;text-transform:uppercase}
.studio-modal .modal-close{background:rgba(255,255,255,0.18);color:#fff}
.studio-modal .modal-close:hover{background:rgba(255,255,255,0.32)}
.studio-body{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;background:var(--butter)}

.studio-welcome{padding:18px 0 8px}
.studio-welcome-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.studio-welcome-h2{font-family:'Lilita One',serif;font-weight:400;font-size:32px;letter-spacing:0.005em;line-height:1.05;color:var(--cobalt-deep);margin-bottom:12px}
.studio-welcome-body{font-family:'Fraunces';font-size:15px;line-height:1.55;color:var(--ink-soft);max-width:680px;margin-bottom:22px;letter-spacing:-0.005em}
.studio-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.studio-starter{background:var(--butter-light);border:1.5px solid var(--cobalt);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;transition:background 0.18s,transform 0.12s,box-shadow 0.15s,border-color 0.18s;display:flex;align-items:flex-start;gap:11px;box-shadow:0 2px 0 var(--cobalt);position:relative}
.studio-starter:hover{background:#fff;transform:translateY(-2px);box-shadow:0 5px 0 var(--cobalt),0 6px 14px rgba(26,58,110,0.1);border-color:var(--magenta)}
.studio-starter-glyph{font-size:18px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(53,133,224,0.1);border:1.5px solid rgba(53,133,224,0.3);flex-shrink:0;line-height:1;transition:all 0.18s}
.studio-starter:hover .studio-starter-glyph{background:rgba(234,126,154,0.14);border-color:var(--magenta);color:var(--magenta-deep)}
.studio-starter-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.studio-starter-label{font-family:'Lilita One',serif;font-weight:400;font-size:15px;letter-spacing:0.005em;color:var(--cobalt-deep);line-height:1.1}
.studio-starter-prompt{font-size:12px;color:var(--ink-soft);line-height:1.45}
.studio-starter-arrow{font-family:'Lilita One',serif;font-size:18px;color:rgba(53,133,224,0.35);line-height:1;flex-shrink:0;transition:transform 0.18s,color 0.18s;align-self:center}
.studio-starter:hover .studio-starter-arrow{color:var(--magenta);transform:translateX(3px)}

.studio-msg{display:flex;flex-direction:column;gap:6px;max-width:88%}
.studio-msg-user{align-self:flex-end;align-items:flex-end}
.studio-msg-assistant{align-self:flex-start}
.studio-msg-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;padding:0 2px}
.studio-msg-user .studio-msg-tag{color:var(--magenta-deep)}
.studio-msg-assistant .studio-msg-tag{color:var(--cobalt)}
.studio-msg-body{font-size:14.5px;line-height:1.6;padding:14px 18px;border-radius:14px;white-space:pre-wrap;font-family:'Inter',sans-serif}
.studio-msg-body-md{white-space:normal}
.studio-msg-body-md .md-h3{font-family:'Lilita One',serif;font-weight:400;font-size:18px;letter-spacing:0.005em;line-height:1.2;color:var(--cobalt-deep);margin:14px 0 6px}
.studio-msg-body-md .md-h3:first-child{margin-top:0}
.studio-msg-body-md .md-h4{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;letter-spacing:0.14em;line-height:1.2;color:var(--magenta-deep);text-transform:uppercase;margin:12px 0 5px}
.studio-msg-body-md .md-h4:first-child{margin-top:0}
.studio-msg-body-md .md-p{margin:0 0 9px;line-height:1.55}
.studio-msg-body-md .md-p:last-child{margin-bottom:0}
.studio-msg-body-md .md-ul{margin:6px 0 10px;padding-left:20px;list-style:disc}
.studio-msg-body-md .md-ul li{margin:3px 0;line-height:1.5}
.studio-msg-body-md .md-quote{border-left:3px solid var(--magenta);padding:8px 14px;margin:8px 0;background:rgba(234,126,154,0.07);border-radius:0 6px 6px 0;font-style:italic;color:var(--cobalt-deep)}
.studio-msg-body-md .md-quote>div{margin:2px 0}
.studio-msg-body-md .md-hr{border:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(53,133,224,0.32) 50%,transparent 100%);margin:14px 0}
.studio-msg-body-md strong{font-weight:700;color:var(--cobalt-deep)}
.studio-msg-body-md em{font-style:italic;color:var(--cobalt-deep)}
.studio-msg-body-md code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:rgba(53,133,224,0.1);padding:1px 6px;border-radius:4px;color:var(--cobalt-deep)}
.studio-msg-user .studio-msg-body{background:var(--magenta);color:#fff;border-bottom-right-radius:4px}
.studio-msg-assistant .studio-msg-body{background:#fff;color:var(--cobalt-deep);border:1.5px solid var(--cobalt-light);border-bottom-left-radius:4px}

.studio-thinking{display:flex;gap:5px;padding:18px 22px;align-items:center}
.studio-thinking span{width:7px;height:7px;border-radius:50%;background:var(--cobalt);animation:studio-pulse 1.2s ease-in-out infinite}
.studio-thinking span:nth-child(2){animation-delay:0.18s}
.studio-thinking span:nth-child(3){animation-delay:0.36s}
@keyframes studio-pulse{0%,80%,100%{opacity:0.25;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}

.studio-error{background:rgba(232,144,125,0.18);color:#9E3F31;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid rgba(232,144,125,0.4)}

.studio-input-meta{padding:8px 24px 0;background:var(--butter-deep);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;color:var(--ink-soft);font-weight:500}
.studio-input-meta strong{color:var(--cobalt-deep);font-weight:700}
.studio-input-hint{display:inline-flex;align-items:center;gap:4px}
.studio-mic{background:#fff;color:var(--cobalt-deep);border:1.5px solid var(--cobalt-light);border-radius:99px;padding:0 16px;font-size:18px;font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.15s;height:46px;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:54px;white-space:nowrap;flex-shrink:0}
.studio-mic:hover:not(:disabled){border-color:var(--cobalt);transform:translateY(-1px);box-shadow:0 3px 8px rgba(26,58,110,0.12)}
.studio-mic:disabled{opacity:0.45;cursor:not-allowed}
.studio-mic-on{background:linear-gradient(135deg,#E04A4A 0%,#D55878 100%);color:#fff;border-color:#C24A4A;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(213,88,120,0.5)}50%{box-shadow:0 0 0 7px rgba(213,88,120,0)}}
.studio-input-listening{border-color:#D55878 !important;box-shadow:0 0 0 3px rgba(213,88,120,0.18) !important;background:#fff}
.studio-input-row{display:flex;gap:10px;padding:14px 24px 16px;background:var(--butter-deep);border-top:1.5px solid var(--cobalt-light);align-items:flex-end;flex-shrink:0}
.studio-input{flex:1;font-family:'Inter',sans-serif;font-size:14px;padding:12px 16px;border:1.5px solid var(--cobalt-light);border-radius:12px;background:var(--butter-light);color:var(--cobalt-deep);resize:none;min-height:46px;max-height:140px;line-height:1.5;outline:none;transition:border-color 0.15s}
.studio-input:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(53,133,224,0.15)}
.studio-input::placeholder{color:#8A99B5}
.studio-input:disabled{opacity:0.6}
.studio-send{background:var(--magenta);color:#fff;border:none;border-radius:99px;padding:13px 22px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:background 0.15s,transform 0.1s;white-space:nowrap}
.studio-send:hover:not(:disabled){background:var(--magenta-deep);transform:translateY(-1px)}
.studio-send:disabled{opacity:0.45;cursor:not-allowed}

@media (max-width:768px){
  .studio-starters{grid-template-columns:1fr}
  .studio-modal{max-height:94vh}
  .studio-head-sub{display:none}
}

/* How it works */
.how-section{margin-bottom:22px}
.how-section h3{font-family:'Fraunces';font-weight:700;font-size:17px;margin-bottom:6px;letter-spacing:-0.01em}
.how-section p{font-size:13px;color:var(--ink-soft);line-height:1.6}
.how-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px;margin-top:14px}
.how-tile{background:#FFFCF0;border:1px solid var(--border);border-radius:10px;padding:12px 13px}
.how-tile-num{font-family:'JetBrains Mono','Courier New',monospace;font-size:10.5px;color:var(--brown);font-weight:600;margin-bottom:5px}
.how-tile-name{font-family:'Fraunces';font-weight:700;font-size:13.5px;margin-bottom:4px}
.how-tile-body{font-size:11px;color:var(--ink-soft);line-height:1.5}

/* HOW IT WORKS — full-page tab (the demo's first stop) */
.howit{padding:0}
.howit-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.3);border-radius:12px;overflow:hidden;margin-top:24px}
.howit-stat{background:rgba(255,255,255,0.08);padding:16px 18px;backdrop-filter:blur(6px)}
.howit-stat-num{font-family:'Lilita One',serif;font-weight:400;font-size:34px;letter-spacing:0.005em;line-height:1;color:#fff}
.howit-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(255,255,255,0.92);font-weight:700;margin-top:6px}

.howit-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--cobalt);border:2px solid var(--cobalt);border-radius:14px;overflow:hidden;margin-bottom:18px;position:relative}
.howit-flow-step{background:var(--butter-light);padding:16px 18px 18px;position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:140px}
.howit-flow-step::after{content:'→';position:absolute;top:50%;right:-13px;transform:translateY(-50%);background:var(--cobalt);color:#fff;font-weight:700;font-size:13px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;z-index:2;border:2px solid var(--butter);border-radius:50%;box-shadow:0 1px 4px rgba(26,58,110,0.18)}
.howit-flow-step:last-child::after{display:none}
.howit-flow-step.you{background:var(--magenta);color:#fff}
.howit-flow-step.you .howit-flow-num{color:rgba(255,255,255,0.92);font-weight:800}
.howit-flow-step.you .howit-flow-name{color:#fff}
.howit-flow-step.you .howit-flow-body{color:rgba(255,255,255,0.94)}
.howit-flow-num{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--cobalt);font-weight:700;text-transform:uppercase;padding-bottom:8px;border-bottom:1px dashed rgba(53,133,224,0.32);margin-bottom:0}
.howit-flow-name{font-family:'Lilita One',serif;font-weight:400;font-size:17px;letter-spacing:0.005em;line-height:1.15;color:var(--cobalt-deep);margin:0}
.howit-flow-body{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0}
.howit-flow-step.you .howit-flow-num{border-bottom-color:rgba(255,255,255,0.45)}

.howit-block{background:#FFFCF0;border:1px solid var(--border);border-radius:14px;padding:24px 28px;margin-bottom:18px}
.howit-block-eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;margin-bottom:6px}
.howit-block h3{font-family:'Lilita One',serif;font-weight:400;font-size:23px;letter-spacing:0.005em;line-height:1.1;margin-bottom:6px;color:var(--cobalt-deep)}
.howit-block-sub{font-family:'Fraunces';font-size:13px;line-height:1.5;color:var(--ink-soft);font-weight:500;margin-bottom:14px;max-width:760px;letter-spacing:-0.005em}


.howit-dna-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.howit-dna-card{background:#FFFDF5;border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.howit-dna-card h4{font-family:'Fraunces';font-weight:700;font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;line-height:1.3}
.howit-dna-card h4::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pink);flex-shrink:0}
.howit-dna-card.bad h4::before{background:var(--coral)}
.howit-chips{display:flex;flex-wrap:wrap;gap:6px}
.howit-chip{background:var(--paper);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:11px;color:var(--ink);font-weight:500;letter-spacing:0.01em;line-height:1.4}
.howit-list{list-style:none;padding:0;margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.howit-list li{padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.howit-list.bad li::before{content:'×';color:var(--coral);font-weight:800;flex-shrink:0;margin-top:1px}

.howit-agents{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howit-agent{background:#FFFDF5;border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.howit-agent-top{display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center}
.howit-agent-icon{font-size:24px;line-height:1}
.howit-agent-name{font-family:'Fraunces';font-weight:700;font-size:16px;line-height:1.2;letter-spacing:-0.01em}
.howit-agent-focus{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-top:3px}
.howit-agent-count{text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--brown);line-height:1.45;flex-shrink:0;min-width:90px}
.howit-agent-count .live-dot{color:#7AB05D;font-weight:700}
.howit-agent-sources{display:flex;flex-wrap:wrap;gap:5px;padding-top:10px;border-top:1px solid #F2EBD3;align-items:center}
.howit-agent-src-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--brown);font-weight:700;text-transform:uppercase;margin-right:4px}
.howit-agent-src{background:var(--paper);border:1px solid var(--border);padding:3px 9px;border-radius:99px;font-size:10.5px;color:var(--ink);font-weight:500;letter-spacing:0.01em}

/* Accordion — deeper looks */
.howit-acc{background:#FFFCF0;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.howit-acc summary{cursor:pointer;padding:18px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;list-style:none;user-select:none;transition:background 0.15s}
.howit-acc summary::-webkit-details-marker{display:none}
.howit-acc summary::marker{display:none}
.howit-acc summary:hover{background:#FFFCEC}
.howit-acc[open] summary{background:#FFFCEC;border-bottom:1px solid var(--border)}
.howit-acc-eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.16em;color:var(--brown);font-weight:700;text-transform:uppercase;min-width:80px}
.howit-acc-title{font-family:'Fraunces';font-weight:700;font-size:18px;letter-spacing:-0.02em;line-height:1.2}
.howit-acc-tease{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:4px}
.howit-acc-chevron{font-family:'JetBrains Mono',monospace;color:var(--brown);font-size:13px;font-weight:700;transition:transform 0.2s;line-height:1}
.howit-acc[open] .howit-acc-chevron{transform:rotate(180deg)}
.howit-acc-body{padding:22px 24px 26px}

.howit-strat{background:linear-gradient(135deg,var(--magenta) 0%,#F2A85F 100%);color:#fff;border-radius:14px;padding:24px 28px;margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.howit-strat::after{content:"✶";position:absolute;top:18px;right:24px;font-size:20px;color:rgba(255,255,255,0.55)}
.howit-strat-icon{font-size:44px;line-height:1}
.howit-strat-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.18em;font-weight:700;color:rgba(255,255,255,0.92);margin-bottom:5px}
.howit-strat-name{font-family:'Lilita One',serif;font-weight:400;font-size:28px;letter-spacing:0.005em;line-height:1;margin-bottom:8px}
.howit-strat-desc{font-size:13px;line-height:1.55;color:rgba(255,255,255,0.96);max-width:680px}

.howit-decisions{display:flex;flex-direction:column}
.howit-decision{padding:13px 0;border-bottom:1px solid #F2EBD3;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.howit-decision:last-child{border-bottom:0}
.howit-decision-verb{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;font-weight:700;padding:4px 9px;border-radius:4px;height:22px;display:flex;align-items:center;text-transform:uppercase;flex-shrink:0;margin-top:1px}
.howit-decision-verb.promoted{background:#E7F0DD;color:#3B6B2D}
.howit-decision-verb.killed{background:#F8DCD7;color:#9E3F31}
.howit-decision-verb.queued{background:#F8F0D9;color:var(--brown)}
.howit-decision-name{font-family:'Fraunces';font-weight:700;font-size:14px;line-height:1.3;margin-bottom:3px}
.howit-decision-reason{font-size:12.5px;color:var(--ink-soft);line-height:1.5}

/* ENCODE — how this gets smarter */
.howit-encode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.howit-encode-col{background:#FFFDF5;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.howit-encode-col.deepen{background:linear-gradient(135deg,rgba(242,181,192,0.12) 0%,rgba(244,183,62,0.10) 100%);border-color:rgba(232,144,125,0.45)}
.howit-encode-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--brown);font-weight:700;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.howit-encode-col.deepen .howit-encode-label{color:#C95C46;border-bottom-color:rgba(232,144,125,0.45)}
.howit-encode-list{list-style:none;padding:0;margin:0;font-size:13px;color:var(--ink);line-height:1.55}
.howit-encode-list li{padding:7px 0;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid rgba(229,221,200,0.5)}
.howit-encode-list li:last-child{border-bottom:0}
.howit-encode-list li::before{content:'';width:5px;height:5px;background:var(--brown);border-radius:50%;flex-shrink:0;margin-top:8px}
.howit-encode-col.deepen .howit-encode-list li::before{background:var(--coral)}

.howit-loop{background:#FFFDF5;border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.howit-loop-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:0.14em;color:var(--brown);font-weight:700;text-transform:uppercase;margin-bottom:14px}
.howit-loop-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.howit-loop-step{background:#FFFCF0;padding:14px 14px 16px;position:relative}
.howit-loop-step::after{content:'→';position:absolute;top:50%;right:-9px;transform:translateY(-50%);background:#FFFDF5;color:var(--brown);font-weight:600;font-size:12px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;z-index:2;border:1px solid var(--border);border-radius:50%}
.howit-loop-step:last-child::after{display:none}
.howit-loop-step-num{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.16em;color:var(--brown);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.howit-loop-name{font-family:'Fraunces';font-weight:700;font-size:13.5px;line-height:1.2;margin-bottom:6px}
.howit-loop-body{font-size:11px;color:var(--ink-soft);line-height:1.5}

/* Teaser tab content */

/* Ticker */
.ticker{background:var(--cobalt-deep);color:#fff;padding:7px 0;font-size:11px;font-weight:500;overflow:hidden;position:relative;border-radius:99px;margin-bottom:18px}
.ticker-track{display:flex;gap:46px;animation:scroll 32s linear infinite;white-space:nowrap}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:8px}
.ticker-dot{width:6px;height:6px;border-radius:50%;background:var(--magenta);box-shadow:0 0 6px rgba(234,126,154,0.8)}
.ticker-dot-signal{background:#5BA0F0;box-shadow:0 0 6px rgba(91,160,240,0.85)}
.ticker-dot-pulse{background:var(--magenta);box-shadow:0 0 6px rgba(234,126,154,0.85)}
.ticker-dot-decision{background:#F4B73E;box-shadow:0 0 6px rgba(244,183,62,0.85)}
.ticker-dot-win{background:#7AB05D;box-shadow:0 0 7px rgba(122,176,93,0.9)}
.ticker-dot-warning{background:#E0A53C;box-shadow:0 0 6px rgba(224,165,60,0.85)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* =====================================================================
   BRAND FLOURISHES — pulled from lovelilbucks.com design language
   (cobalt gingham · flower-blobs · smiling sun · wave dividers ·
    flower claim-badges · buckwheat seal). Applied at brand-touch
    moments only; data surfaces stay clean.
   ===================================================================== */

/* Cobalt gingham/checkerboard texture — two-tone, brand-recognizable */
.checker-cobalt{
  background-color:var(--cobalt);
  background-image:
    linear-gradient(45deg,rgba(255,255,255,0.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,0.06) 75%),
    linear-gradient(45deg,rgba(13,46,99,0.10) 25%,transparent 25%,transparent 75%,rgba(13,46,99,0.10) 75%);
  background-size:40px 40px,40px 40px;
  background-position:0 0,20px 20px;
}
.checker-soft{
  background-image:
    linear-gradient(45deg,rgba(53,133,224,0.045) 25%,transparent 25%,transparent 75%,rgba(53,133,224,0.045) 75%),
    linear-gradient(45deg,rgba(53,133,224,0.045) 25%,transparent 25%,transparent 75%,rgba(53,133,224,0.045) 75%);
  background-size:34px 34px;
  background-position:0 0,17px 17px;
}

/* Flower-blob — the signature scalloped cloud shape (badges, logos, accents) */
.flower-blob{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.flower-blob svg{position:absolute;inset:0;display:block;filter:drop-shadow(0 2px 5px rgba(26,58,110,0.20))}
.flower-blob-label{position:relative;z-index:2;font-family:'Lilita One',Georgia,serif;font-weight:400;color:#fff;text-align:center;line-height:1.02;letter-spacing:0.01em;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.flower-blob-num{position:relative;z-index:2;font-family:'Lilita One',Georgia,serif;color:#fff;line-height:1}

/* Flower claim-badge strip — the "25% magnesium / 5g fiber" brand-truth row */
.truth-strip{display:flex;flex-wrap:wrap;gap:14px 10px;align-items:flex-start;justify-content:center;padding:6px 0 2px}
.truth-badge{display:flex;flex-direction:column;align-items:center;gap:7px;width:104px;text-align:center}
.truth-badge-cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.08em;color:var(--cobalt-deep);font-weight:700;text-transform:uppercase;line-height:1.25}
body.theme-dark .truth-badge-cap{color:#C9D6EC}

/* Wave divider — scalloped cream edge between color blocks */
.wave-divider{display:block;width:100%;line-height:0}
.wave-divider svg{display:block;width:100%}

/* Smiling-sun + seal motifs sit inline; sizing handled per-use */
.brand-ornament{display:flex;align-items:center;justify-content:center;line-height:0}

/* Hero band that uses the gingham (How It Works + Memo) */
.gingham-band{position:relative;border-radius:16px;overflow:hidden;color:#fff;box-shadow:0 2px 0 var(--cobalt-deep)}
.gingham-band .gingham-inner{position:relative;z-index:2;padding:26px 30px 40px}
.gingham-band .wave-divider{position:absolute;left:0;right:0;bottom:-1px;z-index:3}
.gingham-band-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.82);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.gingham-band h2{font-family:'Lilita One',serif;font-weight:400;font-size:27px;letter-spacing:0.005em;line-height:1.08;color:#fff;max-width:680px}
.gingham-band .gb-sun{position:absolute;top:18px;right:22px;z-index:2}

/* Brand-truth flower-badge band */
.hiw-truth-band{background:var(--butter-light);border:1.5px solid var(--cobalt);border-radius:14px;padding:18px 20px 16px;margin:18px 0 22px;box-shadow:0 2px 0 var(--cobalt)}
.hiw-truth-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.16em;color:var(--cobalt);font-weight:700;text-transform:uppercase;text-align:center;margin-bottom:14px}

/* THE SWEEP — visible breadth section */
.sweep{background:var(--butter-light);border:1.5px solid var(--cobalt);border-radius:16px;overflow:hidden;margin:0 0 26px;box-shadow:0 2px 0 var(--cobalt)}
.sweep-head{padding:18px 24px 16px;border-bottom:1.5px solid var(--cobalt-light);position:relative}
.sweep-head::after{content:"";position:absolute;left:24px;right:24px;bottom:-1.5px;height:3px;background:linear-gradient(90deg,var(--cobalt) 0%,#F4B73E 50%,var(--magenta) 100%);border-radius:99px}
.sweep-eye{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--cobalt);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.sweep-title{font-family:'Lilita One',serif;font-weight:400;font-size:21px;letter-spacing:0.005em;line-height:1.1;color:var(--cobalt-deep)}
.sweep-sub{font-family:'Fraunces',Georgia,serif;font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:5px;max-width:560px;letter-spacing:-0.005em}
.sweep-stats{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;background:linear-gradient(180deg,rgba(53,133,224,0.05) 0%,transparent 100%)}
.sweep-stat{flex:1;min-width:120px;text-align:center;padding:10px 8px;background:#fff;border:1.5px solid var(--cobalt-light);border-radius:11px}
body.theme-dark .sweep-stat{background:#202B49}
.sweep-stat-num{font-family:'Lilita One',serif;font-weight:400;font-size:30px;line-height:1;color:var(--cobalt)}

// The signature scalloped flower-cloud. Pass children/num to label it.
function FlowerBlob({size=56, fill="var(--magenta)", petals=11, rot=0, ring=33, pr=16, cls="", style, children, num}){
  const c=50, circles=[];
  for(let i=0;i<petals;i++){
    const a=(i/petals)*Math.PI*2 + rot;
    circles.push(<circle key={i} cx={(c+Math.cos(a)*ring).toFixed(2)} cy={(c+Math.sin(a)*ring).toFixed(2)} r={pr} fill={fill}/>);
  }
  return (<span className={"flower-blob "+cls} style={{width:size,height:size,...(style||{})}}>
    <svg viewBox="0 0 100 100" width={size} height={size} aria-hidden="true">
      {circles}<circle cx={c} cy={c} r={ring+pr-15} fill={fill}/>
    </svg>
    {num!=null && <span className="flower-blob-num" style={{fontSize:size*0.4}}>{num}</span>}
    {children!=null && <span className="flower-blob-label">{children}</span>}
  </span>);
}

// Smiling sun ornament (orange body, navy face) — hero accents.
function SmilingSun({size=44, body="#F4B73E", face="var(--cobalt-deep)"}){
  const c=50, n=12, rays=[];
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, x=c+Math.cos(a)*46, y=c+Math.sin(a)*46;
    const a1=a-0.13, a2=a+0.13;
    rays.push(<path key={i} d={`M${(c+Math.cos(a1)*30).toFixed(1)},${(c+Math.sin(a1)*30).toFixed(1)} L${x.toFixed(1)},${y.toFixed(1)} L${(c+Math.cos(a2)*30).toFixed(1)},${(c+Math.sin(a2)*30).toFixed(1)} Z`} fill={body}/>);
  }
  return (<span className="brand-ornament" style={{width:size,height:size}}>
    <svg viewBox="0 0 100 100" width={size} height={size} aria-hidden="true">
      {rays}
      <circle cx={c} cy={c} r="30" fill={body}/>
      <circle cx="40" cy="46" r="3.4" fill={face}/>
      <circle cx="60" cy="46" r="3.4" fill={face}/>
      <path d="M39,57 Q50,67 61,57" stroke={face} strokeWidth="3.4" fill="none" strokeLinecap="round"/>
    </svg>
  </span>);
}

// Flower claim-badge (the "5g Prebiotic Fiber" brand-truth blobs).
function TruthBadge({big, small, fill="var(--cobalt)", cap}){
  return (<div className="truth-badge">
    <FlowerBlob size={66} fill={fill} petals={12}>
      <span style={{fontFamily:"'Lilita One',serif",fontSize:big&&big.length>3?15:18,lineHeight:1}}>{big}</span>
      {small && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,letterSpacing:'0.04em',fontWeight:700,marginTop:1,maxWidth:58,textTransform:'uppercase'}}>{small}</span>}
    </FlowerBlob>
    {cap && <div className="truth-badge-cap">{cap}</div>}
  </div>);
}

// Scalloped cream wave divider between color blocks.
function WaveDivider({fill="var(--butter)", flip=false, h=22}){
  return (<div className="wave-divider" style={{height:h,transform:flip?'scaleY(-1)':'none'}}>
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none" height={h} aria-hidden="true">
      <path d="M0,28 C100,8 200,8 300,22 C400,36 500,36 600,22 C700,8 800,8 900,22 C1000,36 1100,36 1200,22 L1200,40 L0,40 Z" fill={fill}/>
    </svg>
  </div>);
}

// Helper: format a domain chip
function SourceChip({s}){
  return (<a href={s.url} target="_blank" rel="noopener" className="source-chip" title={s.label}>{s.domain}</a>);
}
function Sources({list}){
  if(!list||!list.length) return null;
  return (<div className="card-sources">{list.map((s,i)=><SourceChip key={i} s={s}/>)}</div>);
}

// Drove-N-Briefs counter (computed)
function drovenBy(signalId, signalType){
  let n=0; Object.entries(BRIEF_LINKS).forEach(([_, l])=>{
    if(signalType==="trend" && l.trends.includes(signalId)) n++;
    if(signalType==="pulse" && l.pulse.includes(signalId)) n++;
    if(signalType==="comp" && l.comps.includes(signalId)) n++;
  });
  return n;
}

// Glyph + short label per question slot — color-coded by question type
const DI_GLYPHS = ["📍", "🎙️", "🎚️"];

function DiagnosticInbox(){
  // answers[qid] shape: { value, note, locked }
  const [answers, setAnswers] = useState({});
  // pendingDraft[qid] holds the textarea content before lock-in
  const [pendingDraft, setPendingDraft] = useState({});
  const [openItem, setOpenItem] = useState(null);
  // Free-form catch-all
  const [freeFormDraft, setFreeFormDraft] = useState("");
  const [freeFormLocked, setFreeFormLocked] = useState(null);

  const total = DIAGNOSTIC_INBOX.length;
  const answeredCount = Object.values(answers).filter(a => a?.locked).length;

  function pickOption(qid, opt) {
    const needsDetail = !!opt.needsDetail;
    setAnswers(prev => ({
      ...prev,
      [qid]: { value: opt.value, label: opt.label, note: prev[qid]?.note || "", locked: !needsDetail }
    }));
  }
  function updateDraft(qid, note) {
    setPendingDraft(prev => ({ ...prev, [qid]: note }));
  }
  function lockIn(qid) {
    const note = pendingDraft[qid] || "";
    setAnswers(prev => ({ ...prev, [qid]: { ...prev[qid], note, locked: true } }));
  }
  function reopen(qid) {
    setAnswers(prev => ({ ...prev, [qid]: { ...prev[qid], locked: false } }));
    setPendingDraft(prev => ({ ...prev, [qid]: answers[qid]?.note || "" }));
    setOpenItem(qid);
  }
  function submitFreeForm() {
    const text = freeFormDraft.trim();
    if (!text) return;
    setFreeFormLocked(text);
    setFreeFormDraft("");
  }

  return (<div className="di-wrap">
    <div className="di-header">
      <div>
        <div className="di-eyebrow">// FROM THE ENGINE · 3 QUESTIONS ONLY YOU CAN ANSWER</div>
        <h3 className="di-title">Your input shapes next week's mix.</h3>
      </div>
      <div className="di-progress">
        <div className="di-progress-num">{answeredCount}/{total}</div>
        <div className="di-progress-label">answered</div>
        <div className="di-progress-bar"><div className="di-progress-fill" style={{width:(answeredCount/total*100)+'%'}}></div></div>
      </div>
    </div>
    <div className="di-grid">
      {DIAGNOSTIC_INBOX.map((q, idx) => {
        const ans = answers[q.id];
        const selectedOpt = ans ? q.options.find(o => o.value === ans.value) : null;
        const isOpen = openItem === q.id;
        const hasSelection = !!ans;
        const isLocked = !!ans?.locked;
        const needsDetail = selectedOpt?.needsDetail;
        return (<div key={q.id} className={"di-item di-item-"+(idx+1)+(isLocked?" di-item-answered":"")+(isOpen?" di-item-open":"")}>
          <button className="di-item-head" onClick={()=>setOpenItem(isOpen ? null : q.id)}>
            <span className="di-item-glyph">{DI_GLYPHS[idx]}</span>
            <div className="di-item-head-body">
              <div className="di-item-eyebrow">{q.eyebrow.replace("// THIS WEEK · ", "")}</div>
              <div className="di-item-question">{q.question}</div>
            </div>
            <div className="di-item-toggle">
              {isLocked ? (
                <span className="di-item-status di-item-status-answered">✓ {ans.label}</span>
              ) : hasSelection ? (
                <span className="di-item-status di-item-status-pending">in progress</span>
              ) : (
                <span className="di-item-status di-item-status-pending">awaiting</span>
              )}
              <span className="di-item-chev">▾</span>
            </div>
          </button>
          {isOpen && (
            <div className="di-item-body">
              <div className="di-item-why">
                <div className="di-item-why-label">Why this matters</div>
                <div className="di-item-why-text">{q.why}</div>
              </div>
              <div className="di-item-impact">
                <span className="di-item-impact-arrow">↳</span>
                <span className="di-item-impact-text"><strong>What changes when you answer:</strong> {q.impact}</span>
              </div>
              {/* OPTIONS */}
              {!isLocked && (<div>
                <div className="di-item-options-label">Your answer</div>
                <div className="di-item-options">

// PhoneShotList — Willa's-pattern swipeable phone-frame shot list (replaces the old PhonePreview)
function PhoneShotList({brief}){
  const [activeFrame, setActiveFrame] = useState(0);
  const recommendedHook = brief.hooks?.find(h => h.recommended)?.text || brief.hooks?.[0]?.text || brief.concept;
  const endcard = brief.benefitShorthand;

  // Build full scene list. If brief has a script, use that. Otherwise synthesize 3 frames.
  const scenes = brief.script && brief.script.length > 0 ? brief.script.map((s, i) => ({
    scene: s.scene ? `Scene ${s.scene}` : `Frame ${i+1}`,
    time: s.time || `0:0${i*4}`,
    action: s.action || brief.concept,
    isHook: i === 1,
    isEndcard: i === brief.script.length - 1
  })) : [
    { scene: "Frame 1", time: "0:00–0:04", action: brief.visual?.split(/[\.!?]/)[0]?.trim() || brief.concept, isHook: false },
    { scene: "Frame 2", time: "0:04–0:12", action: recommendedHook, isHook: true },
    { scene: "Frame 3", time: "0:12–0:22", action: endcard || `${brief.flavor} — Xx Emily`, isEndcard: true }
  ];

  const pillarTheme = brief.pillar === "FUEL" ? "fuel" : brief.pillar === "THE BOWL" ? "bowl" : brief.pillar === "SOIL" ? "soil" : "crunch";

  return (<div className="psl-wrap">
    <div className="psl-header">
      <div>
        <div className="psl-eyebrow">// SHOT LIST · {brief.duration || "video"}</div>
        <div className="psl-title">{scenes.length} {scenes.length === 1 ? 'frame' : 'frames'} · {brief.platform.toLowerCase().includes("tiktok") ? "TikTok" : brief.platform.toLowerCase().includes("carousel") ? "IG Carousel" : "IG Reel"}</div>
      </div>
      {brief.audio && (
        <div className="psl-audio">
          <span className="psl-audio-icon">♪</span>
          <div>
            <div className="psl-audio-label">audio reference</div>
            <div className="psl-audio-text">{brief.audio}</div>
          </div>
        </div>
      )}
    </div>

    <div className="psl-carousel">
      {scenes.map((s, k) => {
        const active = activeFrame === k;
        return (<button key={k} className={"psl-phone"+(active?" psl-phone-active":" psl-phone-dim")+" psl-theme-"+pillarTheme} onClick={()=>setActiveFrame(k)}>
          <div className="psl-phone-notch"></div>
          <div className="psl-phone-scene">{s.scene}</div>

        method: 'POST',
        headers: {'content-type':'application/json'},
        body: JSON.stringify({ competitor_move: liveInput.trim() })

function CrunchBunchPanel({brief}){
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [requested, setRequested] = useState(false);

  // Reset when brief changes (don't auto-fire — wait for user to click 'Run pre-test')
  useEffect(() => { setData(null); setError(null); setRequested(false); }, [brief.id]);

  function runPanel() {
    setRequested(true);
    setLoading(true); setData(null); setError(null);
    fetch('/api/panel', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ brief })
    })
      .then(r => r.json())
      .then(d => {
        if (d.reactions) setData(d);
        else setError(d.detail || d.error || 'panel failed');
        setLoading(false);
      })
      .catch(e => { setError(String(e)); setLoading(false); });
  }

  const scoreColor = (s) => s >= 8 ? 'high' : s >= 5 ? 'mid' : 'low';
  const avg = data ? Math.round((data.reactions.reduce((a,r)=>a+r.score,0) / data.reactions.length) * 10) / 10 : null;

    {error && <div className="panel-error">⚠ {error}</div>}

    {(requested || data) && <div className="panel-grid">

            ) : null}
          </div>
          {loading && !reaction ? (
            <div className="panel-card-pulse"></div>
          ) : reaction ? (
            <>
              <div className="panel-card-quote">"{reaction.reaction}"</div>
              {reaction.suggested_edit && reaction.suggested_edit !== "null" && (
                <div className="panel-card-edit">

                  <span className="panel-card-edit-text">{reaction.suggested_edit}</span>

// ===== Lightweight markdown → React renderer for Strategist replies =====
// Handles **bold**, *italic*, `code`, ## / ### headings, > blockquotes, --- hr, - / · bullets, paragraphs.
function renderStudioInline(text){
  if (!text) return null;
  const out = [];
  let buf = "";
  let k = 0;
  let i = 0;
  const flush = () => { if (buf) { out.push(buf); buf = ""; } };
  while (i < text.length){
    if (text[i] === '*' && text[i+1] === '*'){
      const close = text.indexOf('**', i+2);
      if (close > i+2){ flush(); out.push(<strong key={k++}>{text.slice(i+2, close)}</strong>); i = close + 2; continue; }
    }
    if (text[i] === '*'){
      const close = text.indexOf('*', i+1);
      if (close > i+1 && text[close+1] !== '*' && text[close-1] !== '*'){
        flush(); out.push(<em key={k++}>{text.slice(i+1, close)}</em>); i = close + 1; continue;
      }
    }
    if (text[i] === '`'){
      const close = text.indexOf('`', i+1);
      if (close > i+1){ flush(); out.push(<code key={k++}>{text.slice(i+1, close)}</code>); i = close + 1; continue; }
    }
    buf += text[i]; i++;
  }
  flush();
  return out;
}
function renderStudioMarkdown(text){
  if (!text) return null;
  const lines = text.split('\n');
  const blocks = [];
  let i = 0; let key = 0;
  while (i < lines.length){
    const line = lines[i];
    if (line.startsWith('### ')){ blocks.push(<div key={key++} className="md-h4">{renderStudioInline(line.slice(4))}</div>); i++; }
    else if (line.startsWith('## ')){ blocks.push(<div key={key++} className="md-h3">{renderStudioInline(line.slice(3))}</div>); i++; }
    else if (line.startsWith('# ')){ blocks.push(<div key={key++} className="md-h3">{renderStudioInline(line.slice(2))}</div>); i++; }
    else if (line.trim() === '---' || line.trim() === '***'){ blocks.push(<div key={key++} className="md-hr"/>); i++; }
    else if (line.startsWith('> ')){
      const qs = [];
      while (i < lines.length && lines[i].startsWith('> ')){ qs.push(lines[i].slice(2)); i++; }
      blocks.push(<div key={key++} className="md-quote">{qs.map((l,kk)=>(<div key={kk}>{renderStudioInline(l)}</div>))}</div>);
    }
    else if (/^[-·*] /.test(line)){
      const items = [];
      while (i < lines.length && /^[-·*] /.test(lines[i])){ items.push(lines[i].replace(/^[-·*] /, '')); i++; }
      blocks.push(<ul key={key++} className="md-ul">{items.map((it,kk)=>(<li key={kk}>{renderStudioInline(it)}</li>))}</ul>);
    }
    else if (line.trim() === ''){ i++; }
    else {
      const pl = [];
      while (i < lines.length && lines[i].trim() !== '' && !lines[i].startsWith('#') && !lines[i].startsWith('>') && !/^[-·*] /.test(lines[i]) && lines[i].trim() !== '---' && lines[i].trim() !== '***'){
        pl.push(lines[i]); i++;
      }
      blocks.push(<div key={key++} className="md-p">{pl.map((l,kk)=>(<React.Fragment key={kk}>{kk>0 && <br/>}{renderStudioInline(l)}</React.Fragment>))}</div>);
    }
  }
  return blocks;
}
